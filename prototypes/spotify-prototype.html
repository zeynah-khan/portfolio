<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#121212;
    --bg-card:#181818;
    --bg-card-hover:#242424;
    --sidebar:#000000;
    --green:#1DB954;
    --green-bright:#1ED760;
    --pin:#F5A623;
    --text:#FFFFFF;
    --text-sub:#B3B3B3;
    --text-faint:#727272;
    --line:#282828;
    --radius-md:8px;
    --radius-lg:12px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:#0a0a0a;
    font-family:'Inter',sans-serif;
    color:var(--text);
    display:flex;
    justify-content:center;
    padding:40px 16px;
  }
  .rig{ display:flex; flex-direction:column; align-items:center; gap:14px; }
  .rig-label{
    font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.08em;
    text-transform:uppercase; color:#6b6b6b;
  }
  .app{
    width:1040px; height:680px;
    background:var(--bg);
    border-radius:14px;
    overflow:hidden;
    display:flex; flex-direction:column;
    box-shadow:0 40px 80px -20px rgba(0,0,0,0.7);
    border:1px solid #1f1f1f;
  }
  .app-body{ flex:1; display:flex; min-height:0; }

  /* ---------- sidebar ---------- */
  .sidebar{
    width:240px; background:var(--sidebar); flex-shrink:0;
    display:flex; flex-direction:column; padding:8px;
    border-right:1px solid #000;
  }
  .sidebar-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 10px 6px;
  }
  .sidebar-title{ display:flex; align-items:center; gap:8px; color:var(--text-sub); font-weight:700; font-size:13.5px;}
  .sidebar-title svg{ width:18px;height:18px; stroke:var(--text-sub); }
  .sidebar-add{ width:26px;height:26px;border-radius:50%; background:#1f1f1f; display:flex;align-items:center;justify-content:center; cursor:pointer;}
  .sidebar-add svg{ width:13px;height:13px; stroke:var(--text-sub);}
  .lib-filters{ display:flex; gap:6px; padding:8px 10px; }
  .lib-filter{
    padding:6px 12px; border-radius:20px; background:#1f1f1f; font-size:11.5px; font-weight:600; color:var(--text);
  }
  .lib-list{ flex:1; overflow-y:auto; padding:4px 4px; }
  .lib-item{
    display:flex; align-items:center; gap:10px; padding:7px 8px; border-radius:6px; cursor:pointer;
  }
  .lib-item:hover{ background:#1a1a1a; }
  .lib-swatch{
    width:38px;height:38px;border-radius:6px; flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
  }
  .lib-swatch svg{ width:16px;height:16px; }
  .lib-name{ font-size:12.5px; font-weight:600; color:var(--text); }
  .lib-meta{ font-size:11px; color:var(--text-faint); margin-top:1px;}

  /* ---------- main ---------- */
  .main{ flex:1; display:flex; flex-direction:column; min-width:0; background:linear-gradient(180deg,#1c1c1c 0%, var(--bg) 320px); }
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 24px; flex-shrink:0;
  }
  .topbar-left{ display:flex; align-items:center; gap:14px; }
  .nav-circle{ width:32px;height:32px;border-radius:50%; background:#000; display:flex;align-items:center;justify-content:center; cursor:pointer;}
  .nav-circle svg{ width:16px;height:16px; stroke:var(--text); }
  .search-pill{
    display:flex; align-items:center; gap:10px;
    background:#242424; border-radius:24px; padding:10px 16px; width:340px;
    color:var(--text-faint); font-size:13px;
  }
  .search-pill svg{ width:16px;height:16px; stroke:var(--text-faint); flex-shrink:0;}
  .topbar-right{ display:flex; align-items:center; gap:16px; }
  .topbar-right svg{ width:19px;height:19px; stroke:var(--text-sub); cursor:pointer;}
  .avatar-circle{
    width:28px;height:28px;border-radius:50%; background:linear-gradient(135deg,#5b3ea6,#1DB954);
    display:flex;align-items:center;justify-content:center; font-size:11px; font-weight:700;
  }

  .tabs-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:4px 24px 14px;
  }
  .tabs{ display:flex; gap:8px; }
  .tab{
    padding:8px 18px; border-radius:20px; font-size:13.5px; font-weight:700; cursor:pointer;
    background:#232323; color:var(--text-sub);
  }
  .tab.active{ background:var(--text); color:#000; }
  .tab.discover{ display:flex; align-items:center; gap:6px; }

  .content{ flex:1; overflow-y:auto; padding:0 24px 30px; }
  .content::-webkit-scrollbar{ width:8px; }
  .content::-webkit-scrollbar-thumb{ background:#2c2c2c; border-radius:8px; }

  .section{ margin-bottom:26px; }
  .section-head{
    display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;
  }
  .section-title-wrap{ display:flex; align-items:center; gap:8px; }
  .pin-flag{
    display:flex; align-items:center; gap:4px;
    background:rgba(245,166,35,0.14); color:var(--pin);
    font-size:10px; font-weight:700; padding:3px 8px; border-radius:10px;
    text-transform:uppercase; letter-spacing:.03em;
  }
  .pin-flag svg{ width:10px;height:10px; fill:var(--pin); stroke:none; }
  .section-title{ font-family:'Sora',sans-serif; font-weight:700; font-size:19px; }
  .section-link{ font-size:12.5px; font-weight:700; color:var(--text-faint); cursor:pointer; }

  .menu-wrap{ position:relative; }
  .menu-btn{
    width:30px;height:30px;border-radius:50%; display:flex;align-items:center;justify-content:center;
    cursor:pointer; color:var(--text-faint);
  }
  .menu-btn:hover{ background:#242424; color:var(--text); }
  .menu-btn svg{ width:16px;height:16px; }
  .dropdown{
    position:absolute; top:36px; right:0; background:#282828; border-radius:8px;
    box-shadow:0 8px 24px rgba(0,0,0,0.5); width:170px; padding:6px; z-index:20;
    display:none;
  }
  .dropdown.open{ display:block; }
  .dropdown-item{
    padding:9px 12px; font-size:13px; font-weight:600; border-radius:5px; cursor:pointer;
    display:flex; align-items:center; justify-content:space-between;
  }
  .dropdown-item:hover{ background:#3a3a3a; }
  .dropdown-item.reset{ color:var(--text-faint); }

  .tile-row{ display:grid; grid-template-columns:repeat(6,1fr); gap:14px; }
  .tile{ cursor:pointer; }
  .tile-art{
    width:100%; aspect-ratio:1/1; border-radius:6px; margin-bottom:9px;
    display:flex; align-items:center; justify-content:center;
    position:relative; overflow:hidden;
    transition:transform .15s ease;
  }
  .tile:hover .tile-art{ transform:scale(1.03); }
  .tile-art svg{ width:34%; height:34%; opacity:.85; }
  .tile-name{ font-size:12.5px; font-weight:700; color:var(--text); margin-bottom:2px; line-height:1.3;}
  .tile-sub{ font-size:11px; color:var(--text-faint); line-height:1.3; }

  .player{
    height:72px; background:#181818; border-top:1px solid #282828; flex-shrink:0;
    display:flex; align-items:center; justify-content:space-between; padding:0 16px;
  }
  .player-track{ display:flex; align-items:center; gap:12px; width:260px; }
  .player-art{ width:48px;height:48px;border-radius:5px; background:linear-gradient(135deg,#F5A623,#1DB954); }
  .player-name{ font-size:12.5px; font-weight:600; }
  .player-artist{ font-size:11px; color:var(--text-faint); }
  .player-mid{ display:flex; flex-direction:column; align-items:center; gap:6px; flex:1; max-width:500px; }
  .player-controls{ display:flex; align-items:center; gap:18px; }
  .player-controls svg{ width:16px;height:16px; stroke:var(--text-sub); cursor:pointer; }
  .play-btn{ width:30px;height:30px;border-radius:50%; background:var(--text); display:flex;align-items:center;justify-content:center; cursor:pointer;}
  .play-btn svg{ width:13px;height:13px; stroke:#000; fill:#000; }
  .player-bar{ display:flex; align-items:center; gap:8px; width:100%; }
  .player-bar .time{ font-size:10px; color:var(--text-faint); font-family:'IBM Plex Mono',monospace; }
  .bar-track{ flex:1; height:3px; background:#4d4d4d; border-radius:2px; position:relative; }
  .bar-fill{ position:absolute; left:0; top:0; height:100%; width:38%; background:var(--text); border-radius:2px; }
  .player-right{ width:260px; display:flex; justify-content:flex-end; gap:14px; }
  .player-right svg{ width:16px;height:16px; stroke:var(--text-sub); }

  .toast{
    position:fixed; bottom:100px; left:50%; transform:translateX(-50%) translateY(8px);
    background:#282828; color:var(--text); padding:11px 18px; border-radius:24px; font-size:12.5px; font-weight:600;
    opacity:0; pointer-events:none; transition:all .25s ease; z-index:50; box-shadow:0 8px 24px rgba(0,0,0,0.5);
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  .caption{ max-width:1040px; text-align:center; font-size:12px; color:#8A8368; line-height:1.5; }
</style>

<div class="rig">
  <div class="rig-label">Spotify homepage redesign — interactive prototype</div>
  <div class="app">
    <div class="app-body">
      <div class="sidebar">
        <div class="sidebar-head">
          <div class="sidebar-title">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
            Your Library
          </div>
          <div class="sidebar-add"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg></div>
        </div>
        <div class="lib-filters">
          <div class="lib-filter" style="background:#1DB954;color:#000;">Playlists</div>
          <div class="lib-filter">Artists</div>
        </div>
        <div class="lib-list" id="lib-list"></div>
      </div>

      <div class="main">
        <div class="topbar">
          <div class="topbar-left">
            <div class="nav-circle"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.4"><path d="M15 18l-6-6 6-6"/></svg></div>
            <div class="nav-circle"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.4"><path d="M9 6l6 6-6 6"/></svg></div>
            <div class="search-pill"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>What do you want to play?</div>
          </div>
          <div class="topbar-right">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M18 8a6 6 0 00-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 01-3.4 0"/></svg>
            <div class="avatar-circle">Z</div>
          </div>
        </div>

        <div class="tabs-row">
          <div class="tabs">
            <div class="tab active" data-tab="music" onclick="switchTab('music')">Music</div>
            <div class="tab" data-tab="podcasts" onclick="switchTab('podcasts')">Podcasts</div>
            <div class="tab" data-tab="audiobooks" onclick="switchTab('audiobooks')">Audiobooks</div>
          </div>
        </div>

        <div class="content" id="content"></div>
      </div>
    </div>

    <div class="player">
      <div class="player-track">
        <div class="player-art"></div>
        <div><div class="player-name">Late Night Focus</div><div class="player-artist">Ambient Collective</div></div>
      </div>
      <div class="player-mid">
        <div class="player-controls">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M17 3L7 12l10 9"/></svg>
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M19 20L9 12l10-8v16zM5 19V5"/></svg>
          <div class="play-btn"><svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8V4z"/></svg></div>
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M5 4l10 8-10 8V4zM19 5v14"/></svg>
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M7 3l10 9-10 9"/></svg>
        </div>
        <div class="player-bar"><span class="time">1:32</span><div class="bar-track"><div class="bar-fill"></div></div><span class="time">4:02</span></div>
      </div>
      <div class="player-right">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M9 18V5l12-2v13M9 9l12-2"/></svg>
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>
      </div>
    </div>
  </div>
  <div class="caption">Click a section's ⋯ menu to pin it to the top. Switch tabs to see Podcasts and Audiobooks content.</div>
  <div class="toast" id="toast"></div>
</div>

<script>
  const palette = [
    ['#F5A623','#8B4513'], ['#1DB954','#0d3d21'], ['#5b3ea6','#1c1035'],
    ['#e0245e','#4a0d24'], ['#2d7dd2','#0a2540'], ['#f2994a','#5c2a06'],
    ['#00b8a9','#02332f'], ['#c9184a','#3d0817'], ['#6a4c93','#211433'],
    ['#f9c74f','#5c4600'], ['#43aa8b','#0f3329'], ['#f94144','#4a0f10']
  ];
  function noteIcon(){
    return `<svg viewBox="0 0 24 24" fill="white" stroke="none"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3" fill="white"/><circle cx="17" cy="16" r="3" fill="white"/></svg>`;
  }
  function makeTile(name, sub, i){
    const c = palette[i % palette.length];
    return `<div class="tile" onclick='toast(${JSON.stringify("Opens " + name)})'>
      <div class="tile-art" style="background:linear-gradient(155deg, ${c[0]}, ${c[1]})">${noteIcon()}</div>
      <div class="tile-name">${name}</div>
      <div class="tile-sub">${sub}</div>
    </div>`;
  }

  const DATA = {
    music: [
      {id:'made-for-you', title:'Made For You', sub:'Your weekly mixes, updated', tiles:[
        ['Discover Weekly','Updated Mon'],['Daily Mix 1','Indie / Alt'],['Daily Mix 2','Focus'],
        ['Release Radar','New from artists you follow'],['On Repeat','Your most played'],['Time Capsule','From your teens']
      ]},
      {id:'your-playlists', title:'Your Playlists', sub:'', tiles:[
        ['Gym Playlist','142 songs'],['Sunday Reset','38 songs'],['Rainy Day','61 songs'],
        ['Study Session','90 songs'],['Road Trip','75 songs'],['Late Night Focus','54 songs']
      ]},
      {id:'recent-listening', title:'Based On Your Recent Listening', sub:'', tiles:[
        ['Deep Indie Cuts','Playlist'],['Lo-fi Beats','Playlist'],['Acoustic Mornings','Playlist'],
        ['Bedroom Pop Mix','Playlist'],['Chillwave Radio','Station'],['Mellow Electronic','Playlist']
      ]},
      {id:'new-albums', title:'New Albums For You', sub:'', tiles:[
        ['Coastline','Ari Wren'],['Nocturne','The Sable Hour'],['Paper Moons','Dune & Vale'],
        ['Static Bloom','Ferro Kids'],['Low Tide','Marina Holt'],['Halflight','Coyote June']
      ]},
    ],
    podcasts: [
      {id:'continue-listening', title:'Continue Listening', sub:'', tiles:[
        ['The Weekly Debrief','Ep. 214'],['Mind Over Matter','Ep. 58'],['Small Business, Big Ideas','Ep. 12'],
        ['Night Shift Stories','Ep. 91'],['Curious Minds','Ep. 33'],['The Long Read','Ep. 7']
      ]},
      {id:'trending-podcasts', title:'Trending Podcasts', sub:'', tiles:[
        ['Culture Check','Talk'],['Money Moves','Finance'],['History Uncovered','History'],
        ['Sleep Tales','Wellness'],['The Design Files','Design'],['Startup Diaries','Business']
      ]},
      {id:'new-episodes', title:'New Episodes For You', sub:'', tiles:[
        ['The Weekly Debrief','New'],['Curious Minds','New'],['Night Shift Stories','New'],
        ['Culture Check','New'],['The Design Files','New'],['Sleep Tales','New']
      ]},
    ],
    audiobooks: [
      {id:'currently-reading', title:'Currently Reading', sub:'', tiles:[
        ['The Quiet Hours','4h left'],['Salt & Circuit','2h left'],['Everything, Unfinished','6h left'],
        ['The Long Way Home','1h left'],['Field Notes','3h left'],['Under Glass','5h left']
      ]},
      {id:'recommended-audiobooks', title:'Recommended Audiobooks', sub:'', tiles:[
        ['The Cartographers Daughter','Fiction'],['Built to Last','Business'],['The Slow Path','Memoir'],
        ['Ordinary Weather','Fiction'],['Deep Work Deeper','Self-help'],['A Year of Mornings','Memoir']
      ]},
    ]
  };

  let currentTab = 'music';
  let pinned = {}; // sectionId -> true
  let openMenu = null;

  function switchTab(tab){
    currentTab = tab;
    document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.tab===tab));
    render();
  }

  function togglePin(id){
    pinned[id] = !pinned[id];
    openMenu = null;
    toast(pinned[id] ? 'Pinned to top' : 'Unpinned');
    render();
  }

  function toggleMenu(id, ev){
    ev.stopPropagation();
    openMenu = openMenu === id ? null : id;
    render();
  }

  function render(){
    const sections = [...DATA[currentTab]];
    sections.sort((a,b)=> (pinned[b.id]?1:0) - (pinned[a.id]?1:0));
    const el = document.getElementById('content');
    el.innerHTML = sections.map(s=>`
      <div class="section">
        <div class="section-head">
          <div class="section-title-wrap">
            <div class="section-title">${s.title}</div>
            ${pinned[s.id] ? `<div class="pin-flag"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="6"/></svg>Pinned</div>` : ''}
          </div>
          <div class="menu-wrap">
            <div class="menu-btn" onclick="toggleMenu('${s.id}', event)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="5" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.4" fill="currentColor" stroke="none"/></svg>
            </div>
            <div class="dropdown ${openMenu===s.id ? 'open':''}">
              <div class="dropdown-item" onclick="togglePin('${s.id}')"><span>${pinned[s.id] ? 'Unpin section' : 'Pin to top'}</span></div>
              <div class="dropdown-item" onclick="toast('Sort options')"><span>Sort</span></div>
              <div class="dropdown-item" onclick="toast('Reorganise mode')"><span>Reorganise</span></div>
              <div class="dropdown-item reset" onclick="resetAll()"><span>Reset to default</span></div>
            </div>
          </div>
        </div>
        <div class="tile-row">${s.tiles.map((t,i)=>makeTile(t[0],t[1],i)).join('')}</div>
      </div>
    `).join('');
  }

  function resetAll(){
    pinned = {};
    openMenu = null;
    toast('Reset to default order');
    render();
  }

  document.addEventListener('click', ()=>{ if(openMenu){ openMenu=null; render(); } });

  const libItems = [
    ['Liked Songs','#5b3ea6'], ['Gym Playlist','#F5A623'], ['Sunday Reset','#1DB954'],
    ['Rainy Day','#2d7dd2'], ['Study Session','#e0245e'], ['Road Trip','#00b8a9'],
    ['Late Night Focus','#f2994a'], ['Deep Indie Cuts','#c9184a']
  ];
  document.getElementById('lib-list').innerHTML = libItems.map(([name,color])=>`
    <div class="lib-item" onclick='toast(${JSON.stringify("Opens " + name)})'>
      <div class="lib-swatch" style="background:${color}">${noteIcon()}</div>
      <div><div class="lib-name">${name}</div><div class="lib-meta">Playlist</div></div>
    </div>
  `).join('');

  let toastTimer;
  function toast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>t.classList.remove('show'), 1800);
  }

  render();
</script>
